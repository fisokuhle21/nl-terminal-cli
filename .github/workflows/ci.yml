name: nl-terminal-cli CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================
  # Node.js Test Job
  # Tests the CLI on multiple Node.js versions and platforms
  # ============================================
  node-test:
    name: Node.js Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Run tests
      run: npm run test
      env:
        NL_TERMINAL_CLI_TEST: '1'
    
    - name: Test CLI version
      run: node dist/src/cli.js --version
    
    - name: Test CLI help
      run: node dist/src/cli.js --help
      env:
        NL_TERMINAL_CLI_TEST: '1'

  # ============================================
  # Bun Test Job
  # Tests the CLI using Bun runtime on all platforms
  # ============================================
  bun-test:
    name: Bun Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js for tests
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Install dependencies
      run: bun install

    - name: Install Node.js dependencies
      run: npm ci
    
    - name: Build project for Bun
      run: bun run build:bun

    - name: Build project for Node.js tests
      run: npm run build:node
    
    - name: Run tests
      run: bun test tests
      env:
        NL_TERMINAL_CLI_TEST: '1'

  # ============================================
  # Cross-Platform Compatibility Job
  # Tests platform-specific features like editor detection
  # ============================================
  compatibility-test:
    name: Compatibility Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Test command availability (Unix)
      if: runner.os != 'Windows'
      run: |
        echo "Testing 'which' command availability..."
        which node
        which npm
        which git || echo "git not installed"
    
    - name: Test command availability (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "Testing 'where' command availability..."
        where node
        where npm
        where git || echo "git not installed"
      shell: cmd
    
    - name: Test CLI help
      run: node dist/src/cli.js --help

